# /etc/ssh/sshd_config.d/00-confera-hardening.conf (root:root, 0644; check with `sshd -t`).
# The SSH server of a Confera server (ADR-26; SEC-M4I-01). ST-63 runs sshd with it.
#
# Its name sorts before every other file of sshd_config.d (Ubuntu's cloud image ships
# 50-cloud-init.conf with PasswordAuthentication yes), and for sshd the first value of an option
# wins, so these values hold whatever comes later. No Match block here: a Match block runs to the
# end of its file, and the deploy users' block is 50-confera-deploy.conf (sshd-confera-deploy.conf).
#
# Who may log in: members of the group confera-ssh, by key, and nobody else. The group holds the
# personal admin account and the two deploy users (confera-deploy-be, confera-deploy-web); create
# it and add the admin account BEFORE this file is installed, and keep a second session open until
# a new login has worked:
#   groupadd --system confera-ssh
#   usermod -aG confera-ssh <admin-user>
#   useradd --create-home --shell /bin/bash --groups confera-ssh confera-deploy-be   (and -web)

PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
AllowGroups confera-ssh
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no
ClientAliveInterval 300
ClientAliveCountMax 2
