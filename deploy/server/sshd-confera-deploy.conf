# /etc/ssh/sshd_config.d/50-confera-deploy.conf (M4-BE-08; ADR-27, staging rule 4). ST-63.
#
# One deploy user per repository, each with one key, which can do one thing: hand an image
# digest of its own repository to the deploy script. No shell, no terminal, no forwarding of
# any kind, no agent, no X11, no ~/.ssh/rc, no environment from the client. The keys live in a
# root-owned directory, so a deploy user cannot add one.
#
# On top of this, each key's line carries `restrict` (authorized_keys.example), so the key stays
# confined even if this file were lost.

Match User confera-deploy-be,confera-deploy-web
	AuthorizedKeysFile /etc/ssh/confera-deploy/%u.keys
	AuthenticationMethods publickey
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	PermitTTY no
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitUserRC no
	PermitListen none
	PermitOpen none
	GatewayPorts no

Match User confera-deploy-be
	ForceCommand /usr/local/sbin/confera-deploy-gate be

Match User confera-deploy-web
	ForceCommand /usr/local/sbin/confera-deploy-gate web
