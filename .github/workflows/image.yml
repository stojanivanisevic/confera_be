# The production images of confera_be (M4-BE-07, M4-BE-08; ADR-27, rules 2 and 3).
#
# Runs on every push to develop (a staging candidate), on every version tag, and by hand. Every
# run builds and checks; only a run on develop or on a v* tag, started by Stojan, publishes
# (SEC-M4I-03): a build of any other branch, or a run anyone else started, never reaches the
# registry, so no unreviewed image gets a digest the server would take. A tag ruleset lets only
# Stojan create v* tags (README, Gate 4a).
#
#   build    runs project code (install, build) and the image checks. It holds NO credential:
#            the token can read the repository, and nothing else. The images leave it as OCI
#            archives, with their digests.
#   publish  runs NO project code (no checkout): it copies the two archives to the registry
#            unchanged, so the digests stay the ones the build printed, and checks that they did.
#            Its token may write packages, and nothing else.
#
# Neither job can reach a server. A staging deploy is .github/workflows/deploy-staging.yml, started
# by hand with the digest this workflow writes into its summary.
name: image

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/stojanivanisevic

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      jobs-digest: ${{ steps.build.outputs.jobs-digest }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: A builder that writes OCI archives (BuildKit v0.33.1, by digest)
        run: >
          docker buildx create --name confera --driver docker-container --use
          --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Build the jobs and runtime images
        id: build
        run: |
          bash deploy/ci/build-images.sh "$RUNNER_TEMP/images" "$GITHUB_SHA"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/images/digests.env"
          echo "digest=$CONFERA_BE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "jobs-digest=$CONFERA_BE_JOBS_DIGEST" >> "$GITHUB_OUTPUT"
      - name: ST-02 and ST-04 on the images and the resolved compose file
        run: node deploy/checks/topology.mjs --images-only --no-build
      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: confera-be-images
          path: |
            ${{ runner.temp }}/images/jobs.tar
            ${{ runner.temp }}/images/runtime.tar
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    # Nothing is published before Gate 4a: the repository variable IMAGE_PUBLISH_ENABLED is set to
    # true there. Until then the build job still builds and checks every image. Then only from
    # develop or a v* tag, and only in a run Stojan started (github.actor: who started it;
    # github.triggering_actor: who started this attempt, a re-run included).
    if: >-
      vars.IMAGE_PUBLISH_ENABLED == 'true'
      && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
      && github.actor == 'stojanivanisevic' && github.triggering_actor == 'stojanivanisevic'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      # Refuse anyone but the owner, loudly (the job's `if` above already skips it for anyone
      # else; this step fails a run that reached it some other way). deploy/checks/workflows.mjs
      # runs this script with other actors and refs.
      - name: Refuse anyone but the owner
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
        run: |
          OWNER=stojanivanisevic
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only $OWNER may run this job; it was started by $ACTOR (triggered by $TRIGGERING_ACTOR)." >&2
            exit 1
          fi
          case "$REF" in
            refs/heads/develop | refs/tags/v*) ;;
            *)
              echo "::error::This job runs only from develop or a v* tag, not from $REF." >&2
              exit 1
              ;;
          esac
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: confera-be-images
          path: ${{ runner.temp }}/images
      - name: Copy the archives to the registry, digests unchanged
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          DIGEST: ${{ needs.build.outputs.digest }}
          JOBS_DIGEST: ${{ needs.build.outputs.jobs-digest }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$JOBS_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          tags=("sha-$GITHUB_SHA")
          if [ "$REF_TYPE" = tag ]; then tags+=("$REF_NAME"); fi
          push() {
            local archive=$1 repository=$2 expected=$3 tag actual
            for tag in "${tags[@]}"; do
              skopeo copy --quiet --preserve-digests "oci-archive:$RUNNER_TEMP/images/$archive" "docker://$REGISTRY/$repository:$tag"
            done
            actual=$(skopeo inspect --format '{{.Digest}}' "docker://$REGISTRY/$repository@$expected")
            [ "$actual" = "$expected" ] || { echo "the registry holds $actual, not $expected" >&2; exit 1; }
          }
          push jobs.tar confera-be-jobs "$JOBS_DIGEST"
          push runtime.tar confera-be "$DIGEST"
          skopeo logout ghcr.io
      - name: Summary
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          JOBS_DIGEST: ${{ needs.build.outputs.jobs-digest }}
        run: |
          {
            echo "### confera-be $GITHUB_SHA"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`$REGISTRY/confera-be\` (API and worker) | \`$DIGEST\` |"
            echo "| \`$REGISTRY/confera-be-jobs\` (named by the API image) | \`$JOBS_DIGEST\` |"
            echo
            echo "To deploy to staging: run the workflow **deploy-staging** with the digest \`$DIGEST\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # A run on develop or a v* tag that someone other than Stojan started (a bot or a collaborator
  # with Write, a dispatch or a re-run): the publish job above is skipped, and this job fails, so
  # the run is red and says why instead of passing quietly without an image.
  publish-refused:
    if: >-
      vars.IMAGE_PUBLISH_ENABLED == 'true'
      && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
      && !(github.actor == 'stojanivanisevic' && github.triggering_actor == 'stojanivanisevic')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Only Stojan's runs publish
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::Nothing was published: only stojanivanisevic's runs publish images; this one was started by $ACTOR (triggered by $TRIGGERING_ACTOR)." >&2
          exit 1
