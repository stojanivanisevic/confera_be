# Development stack of Confera (ADR-24): PostgreSQL, the mail catcher and the fake clamd.
# For the developer machine only: every port is bound to 127.0.0.1.
#
# One stack per checkout (M1-ISS-13): start it with `corepack pnpm stack:up` and stop it
# with `corepack pnpm stack:down`, never with `docker compose` directly. The script gives
# the project a name of this checkout's own (so containers and the volume are this
# checkout's own) and the ports of .env, and refuses ports that another checkout uses.
# Without the variables it sets, this file refuses to start.
#
# Images are referenced by digest (ADR-01); `pnpm supply-chain` checks it.
# The values come from .env (copy .env.example), never from this file.
name: ${CONFERA_STACK_NAME:?start the stack with corepack pnpm stack:up}

services:
  postgres:
    # PostgreSQL 18.6 (Debian trixie)
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${CONFERA_DB_PORT:?start the stack with corepack pnpm stack:up}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username postgres --dbname postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Mailpit v1.31.5: catches every outgoing mail of the development stack.
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    environment:
      # No reverse DNS lookup of the client before the greeting: without it Mailpit
      # greets after about 8 s on many machines, and every test mail waits that long.
      MP_SMTP_DISABLE_RDNS: 'true'
    ports:
      # web screen
      - '127.0.0.1:${CONFERA_MAIL_WEB_PORT:?start the stack with corepack pnpm stack:up}:8025'
      # SMTP
      - '127.0.0.1:${CONFERA_MAIL_SMTP_PORT:?start the stack with corepack pnpm stack:up}:1025'

  fake-clamd:
    # The FAKE ClamAV daemon of the development stack (scripts/fake-clamd.mjs): every stream is
    # clean but the EICAR test string. Optional: stack:up starts it unless CONFERA_FAKE_CLAMD=off.
    # Never on a server: deploy/compose.yml runs the real ClamAV, and the API of a server refuses
    # this service's name as CLAMAV_ADDRESS. Node 22.23.3, the image of the Dockerfile.
    image: node:22.23.3-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    profiles: [fake-clamd]
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      # Inside its own container; Docker publishes the port on 127.0.0.1 only (below).
      FAKE_CLAMD_HOST: 0.0.0.0
      FAKE_CLAMD_PORT: '3310'
    command: ['node', '/opt/confera/fake-clamd.mjs', '--in-development-stack']
    volumes:
      - ./scripts/fake-clamd.mjs:/opt/confera/fake-clamd.mjs:ro
    ports:
      - '127.0.0.1:${CONFERA_CLAMD_PORT:?start the stack with corepack pnpm stack:up}:3310'
    healthcheck:
      test: ['CMD', 'node', '/opt/confera/fake-clamd.mjs', '--in-development-stack', '--ping']
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 128m

# The volume of this checkout's stack: Compose names it <project>_pgdata.
volumes:
  pgdata:
