# Development stack of Confera (ADR-24). For the developer machine only: every port is
# bound to 127.0.0.1. Start it with `corepack pnpm stack:up`, stop it with `stack:down`.
#
# Images are referenced by digest (ADR-01); `pnpm supply-chain` checks it.
# The values come from .env (copy .env.example), never from this file.
name: confera

services:
  postgres:
    # PostgreSQL 18.6 (Debian trixie)
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: confera-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - confera_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username postgres --dbname postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Mailpit v1.31.5: catches every outgoing mail of the development stack.
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    container_name: confera-mailpit
    ports:
      - '127.0.0.1:8025:8025' # web screen
      - '127.0.0.1:1025:1025' # SMTP

volumes:
  confera_pgdata:
    name: confera_pgdata
